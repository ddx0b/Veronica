name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Run deterministic unit, integration & E2E tests
        run: npm test

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical || true
